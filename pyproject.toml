[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals-engine"
version = "0.1.0"
description = "Production-grade evaluation & regression testing framework for conversational AI agents (WhatsApp/CRM)"
readme = "README.md"
authors = [{ name = "Jean Carlo Ferreira", email = "jeancarlof@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
agent-evals = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
