<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with Deep Gradient -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-gradient)"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0c1024"/>
      <stop offset="100%" stop-color="#080b18"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Ambient Glow Circles -->
  <circle cx="1050" cy="120" r="220" fill="url(#accent-glow)"/>
  <circle cx="150" cy="300" r="180" fill="url(#accent-glow)"/>

  <!-- Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="rgba(99, 102, 241, 0.3)" stroke-width="2"/>

  <!-- Status Pill -->
  <rect x="80" y="60" width="340" height="34" rx="17" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
  <circle cx="102" cy="77" r="5" fill="#10b981"/>
  <text x="120" y="82" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PRODUCTION SUITE • OMNIVERSO DIGITAL</text>

  <!-- Main Title -->
  <text x="80" y="170" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">AGENT EVALS ENGINE</text>

  <!-- Subtitle -->
  <text x="80" y="225" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">Continuous AI Agent Evaluation, Safety Benchmarks & WhatsApp/CRM Audit Suite</text>

  <!-- Accent Divider -->
  <rect x="80" y="260" width="1040" height="1" fill="rgba(255, 255, 255, 0.08)"/>

  <!-- Metrics / Tech Badges -->
  <g transform="translate(80, 295)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="190" height="48" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="16" y="20" fill="#64748b" font-family="monospace" font-size="10" font-weight="600">TEST STATUS</text>
    <text x="16" y="38" fill="#10b981" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">7/7 CI PASSING (100%)</text>

    <!-- Badge 2 -->
    <rect x="210" y="0" width="230" height="48" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="226" y="20" fill="#64748b" font-family="monospace" font-size="10" font-weight="600">VALIDATION TYPE</text>
    <text x="226" y="38" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Multi-Turn Deterministic & LLM-as-Judge</text>

    <!-- Badge 3 -->
    <rect x="460" y="0" width="220" height="48" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="476" y="20" fill="#64748b" font-family="monospace" font-size="10" font-weight="600">DATA MODELS</text>
    <text x="476" y="38" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Pydantic V2 Strict Typing</text>

    <!-- Badge 4 -->
    <rect x="700" y="0" width="210" height="48" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="716" y="20" fill="#64748b" font-family="monospace" font-size="10" font-weight="600">DISTRIBUTION</text>
    <text x="716" y="38" fill="#facc15" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">PyPI Wheel & CLI Ready</text>
  </g>
</svg>
